    <path d="M79 149 137 91" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g transform="translate(350 82)" fill="#182018" font-family="Inter, Segoe UI, Arial, sans-serif">
