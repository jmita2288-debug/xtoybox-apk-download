    <text x="2" y="118" font-size="21" font-weight="600" fill="#3C6F39">SITE OFICIAL · ANDROID</text>
    <text x="2" y="166" font-size="25" font-weight="500" fill="#566256">Remote Play do console e acesso a experiências</text>
    <text x="2" y="202" font-size="25" font-weight="500" fill="#566256">compatíveis com jogos na nuvem.</text>
  </g>

  <g transform="translate(350 292)" font-family="Inter, Segoe UI, Arial, sans-serif">
