<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de download do XTOYBOX</title>
  <desc id="desc">O site chama a rota de download, registra a contagem e redireciona para o APK publicado no GitHub Releases.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#253C25" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#79A873"/>
    </marker>
  </defs>

  <rect width="1200" height="330" rx="28" fill="#F7FAF5"/>
  <text x="54" y="55" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750" fill="#263226">COMO O DOWNLOAD FUNCIONA</text>

  <path d="M350 174H430" stroke="#79A873" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M770 174H850" stroke="#79A873" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(50 94)" filter="url(#shadow)">
    <rect width="300" height="160" rx="22" fill="#FFFFFF" stroke="#D9E4D6"/>
    <circle cx="50" cy="50" r="23" fill="#E6F6E2"/>
    <path d="M50 37v22m0 0-9-9m9 9 9-9M39 67h22" fill="none" stroke="#318F29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="47" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#1B251B">Site oficial</text>
    <text x="88" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#667066">Botão “Baixar APK”</text>
    <text x="28" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#345634">xtoybox.cloud</text>
  </g>

  <g transform="translate(450 94)" filter="url(#shadow)">
    <rect width="300" height="160" rx="22" fill="#FFFFFF" stroke="#D9E4D6"/>
    <circle cx="50" cy="50" r="23" fill="#EAF2FF"/>
    <path d="M38 50h24M50 38v24" stroke="#356C9B" stroke-width="3" stroke-linecap="round"/>
    <text x="88" y="47" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#1B251B">Rota do site</text>
    <text x="88" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#667066">Registra a solicitação</text>
    <text x="28" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#355873">/api/download</text>
  </g>

  <g transform="translate(850 94)" filter="url(#shadow)">
    <rect width="300" height="160" rx="22" fill="#FFFFFF" stroke="#D9E4D6"/>
    <circle cx="50" cy="50" r="23" fill="#F0F1F2"/>
    <path d="M39 57c0-13 22-13 22 0v5H39Zm4-14a7 7 0 1 1 14 0 7 7 0 0 1-14 0Z" fill="#30363D"/>
    <text x="88" y="47" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" fill="#1B251B">GitHub Releases</text>
    <text x="88" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#667066">Entrega o APK publicado</text>
    <text x="28" y="116" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#4E5850">Redirecionamento seguro</text>
  </g>

  <text x="600" y="297" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#687368">A contagem é mantida em arquivo persistente no repositório e consultada pelo site.</text>
</svg>
